<section class="favorites-panel" [class.active]="isOpen">
  <div class="favorites-panel__content">
    <div class="favorites-panel__header">
      <div>
        <h3>Favorites</h3>
        <p>{{ favoriteCount() }} selected</p>
      </div>
      <button type="button" class="favorites-close" (click)="close()">
        <i class="ri-close-line"></i>
      </button>
    </div>

    @if (favorites().length > 0) {
      <ul class="favorites-list">
        @for (product of favorites(); track product.id) {
          <li class="favorite-item">
            <img [src]="product.images[0]" [alt]="product.title" />
            <div class="favorite-item__info">
              <span class="favorite-item__title">{{ product.title }}</span>
              <span class="favorite-item__price">{{ product.price | currency }}</span>
            </div>
            <div class="favorite-item__actions">
              <button
              type="button"
              class="add-to-cart-button favorite-add-to-cart-button"
              (click)="addToCart(product)"
              >Add to Cart</button>
              <button type="button"
              class="remove-favorite"
              (click)="removeFavorite(+ product.id)"
              >
              <i class="ri-delete-bin-line"></i>
            </button>
            </div>
          </li>
        }
      </ul>
    } @else {
      <p class="favorites-empty">No favorites yet.</p>
    }
  </div>
</section>
