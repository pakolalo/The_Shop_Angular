<li class="cart-container">
        <div class="cart-item">
          <figure class="cart-img-container">
            <img [src]="product().image" alt="" />
          </figure>
          <h3 class="cart-item-description">{{ product().title }}</h3>
        </div>
        <div class="bottom-cart-container">
          <div class="quantity-container">
            <button>-</button>
            <p>1</p>
            <button>+</button>
          </div>
          <p>{{ product(). price}}</p>
          <button class="remove-button">
            <i class="ri-close-line"></i>
          </button>
        </div>
      </li>
